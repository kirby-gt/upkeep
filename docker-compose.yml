services:
  postgres:
    image: postgres:16-alpine
    container_name: upkeep_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: upkeep
      POSTGRES_PASSWORD: upkeep_dev_password
      POSTGRES_DB: upkeep
    ports:
      # Exposed on 5433 locally so it never collides with another Postgres
      # you might already have running on the default 5432.
      - "5433:5432"
    volumes:
      - upkeep_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U upkeep -d upkeep"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  upkeep_pg_data:
